services:
  wazi-app:
    image: waziup/irrigation-prediction:latest
    container_name: waziup.irrigation-prediction
    build:
      context: ./
    mem_limit: 3100m
    memswap_limit: 3100m
    volumes:
      #- ./:/root/src/  # Uncomment for development
      - ./:/var/lib/waziapp/ # The unix socket has to have this name and be in ./ : proxy.sock
    privileged: false
    environment:
      # Keep production routing independent from the developer API_URL in .env.
      API_URL: ${WAZIGATE_API_URL:-http://wazigate:8080/}
      Proxy_URL: /var/lib/waziapp/proxy.sock
      # All application-owned structured state shares one persistent database.
      APP_STATE_DB: /var/lib/waziapp/data/wazifarm.sqlite3
      WAZIGATE_USERNAME: ${WAZIGATE_USERNAME:-}
      WAZIGATE_PASSWORD: ${WAZIGATE_PASSWORD:-}
      # Requests arrive through the WaziGate Unix-socket app proxy.
      TRUST_WAZIGATE_PROXY_HEADERS: "true"
      LOAD_DATA_FROM_CSV: ${LOAD_DATA_FROM_CSV:-False}
      SKIP_DATA_PREPROCESSING: ${SKIP_DATA_PREPROCESSING:-False}
      SKIP_TRAINING: ${SKIP_TRAINING:-False}
      PERFORM_TRAINING: ${PERFORM_TRAINING:-True}
      SPACEIOTBOX_API_KEY: ${SPACEIOTBOX_API_KEY:-}
      SPACEIOTBOX_BASE_URL: ${SPACEIOTBOX_BASE_URL:-https://www.smartafrihub.com/spaceiotbox/api}
    healthcheck:
      test: curl --fail --unix-socket /var/lib/waziapp/proxy.sock http://localhost/ || exit 1
      interval: 30s
      retries: 10 # Will try for 5 minutes
      start_period: 30s
    restart: always
    extra_hosts:
      - "wazigate:host-gateway"
#-------------------------#

networks:
  default:
    name: wazigate
